<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Flashcards</title>
  <link rel="stylesheet" href="style.css">
  <script src="script.js" defer></script>
</head>
<body>
  <main class="container">
    <h1>Vocab Flashcards</h1>

    <form id="word-form">
      <label for="english-word">English</label>
      <input type="text" id="english-word" name="english" required>

      <label for="german-word">Deutsch</label>
      <input type="text" id="german-word" name="german" required>

      <button type="submit">➕ Hinzufügen</button>
    </form>

    <p id="form-message" aria-live="polite"></p>

    <h2>Gespeicherte Wortpaare</h2>
    <ul id="word-list"></ul>

    <h2>Üben</h2>
    <button id="practice-card" type="button" disabled>Noch keine Wortpaare zum Üben.</button>
    <button id="known-card" type="button" disabled>✅ I knew it</button>
    <button id="next-card" type="button" disabled>➡️ Next</button>
    <p id="known-count" aria-live="polite">I knew it: 0</p>
  </main>
</body>
</html>
